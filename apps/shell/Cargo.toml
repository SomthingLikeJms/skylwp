[package]
name = "ascii-city-wallpaper"
version = "0.9.3"
description = "Portable Windows ASCII city live wallpaper"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tiny_http = "0.12"
sysinfo = "0.37"
wasapi = "0.26"
webview2-com = "0.39"
rustfft = "6"
windows-core = "0.62.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62", features = [
  "Foundation", "Media_Control", "Storage_Streams", "Devices_Geolocation",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
  "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_Power", "Win32_System_Registry", "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus",
  "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_WinRT", "Win32_System_Variant",
  "Win32_Networking_WinHttp",
  "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_System_Ole",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
