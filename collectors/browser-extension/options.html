<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>连接 ASCII 城市</title><style>body{font:15px/1.7 system-ui;max-width:620px;margin:60px auto;color:#cdd5e5;background:#0a1020}label{display:block;margin:16px 0}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:8px;border-radius:5px}button{background:#f2b35b;border:0;cursor:pointer}small{color:#9ba7ba}#status{min-height:30px}</style><h1>连接 ASCII 城市</h1><p>从壁纸程序的 data/runtime.json 复制端口和令牌。该文件在每次启动后更新。</p><label>端口<input id="port" type="number" min="1024" max="65535"></label><label>令牌<input id="token" type="password" maxlength="64" autocomplete="off"></label><button id="save">保存连接</button><p id="status" role="status"></p><small>扩展仅发送标签标识和类别。网址只在扩展内用于分类，标题不会被读取。默认内置计数无需此扩展；加载扩展后可补充类别。</small><script src="options.js"></script></html>
